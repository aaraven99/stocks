[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-swing-trading-research"
version = "0.1.0"
description = "Point-in-time US-equity swing-trading research and paper-simulation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aarav" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pandas-market-calendars>=5.1",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
swing-research = "swing_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/refresh_github_research.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas_market_calendars", "sklearn.*", "yfinance"]
ignore_missing_imports = true
