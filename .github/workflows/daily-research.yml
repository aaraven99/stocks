name: Daily research safety gate

on:
  # GitHub Actions cron is UTC-only. 10:00 UTC is 5 AM CDT and 11:00 UTC is 5 AM CST.
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - id: gate
        shell: bash
        run: uv run swing-research workflow-gate >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run_daily == 'true'
        shell: bash
        run: |
          echo "Live data collection is disabled in public GitHub Actions."
          echo "Run daily research locally with an admissible provider; do not publish provider data or derived artifacts."
